# /etc/modprobe.d/ps5-wifi.conf
# PlayStation 5 Wi-Fi Hardware Module Configuration

# MediaTek MT7921e (PlayStation 5 Slim / CFI-12xx & CFI-20xx)
# Prevent runtime ASPM state changes from conflicting with Salina southbridge
options mt7921e disable_aspm=1

# NXP / Marvell IW620 (PlayStation 5 CFI-10xx / CFI-11xx)
# Enable fresh firmware reset on probe if warm-booted from kexec / Orbis OS
options moal ps5_fresh_fw=1
