name: Verify Wi-Fi Driver Patches

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/wifi/**'
      - '.github/workflows/verify-wifi-patches.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'patches/wifi/**'
      - '.github/workflows/verify-wifi-patches.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Deep Patch Verification & Sequential Dry-Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Deep Static & Syntax Verification Suite
        run: |
          cd patches/wifi
          python3 verify_patches.py

      - name: Prepare Test Kernel Tree for MT7921 Patches
        run: |
          mkdir -p /tmp/kernel-tree/drivers/net/wireless/mediatek/mt76/mt7921
          mkdir -p /tmp/kernel-tree/arch/x86/configs
          curl -fsSL https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/drivers/net/wireless/mediatek/mt76/mt7921/init.c -o /tmp/kernel-tree/drivers/net/wireless/mediatek/mt76/mt7921/init.c
          curl -fsSL https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/drivers/net/wireless/mediatek/mt76/mt7921/pci.c -o /tmp/kernel-tree/drivers/net/wireless/mediatek/mt76/mt7921/pci.c
          cp patches/wifi/.config /tmp/kernel-tree/arch/x86/configs/ps5_defconfig 2>/dev/null || touch /tmp/kernel-tree/arch/x86/configs/ps5_defconfig
          git -C /tmp/kernel-tree init
          git -C /tmp/kernel-tree config user.name "CI Validator"
          git -C /tmp/kernel-tree config user.email "ci@ps5-linux.local"
          git -C /tmp/kernel-tree add .
          git -C /tmp/kernel-tree commit -m "Initialize baseline MT7921 kernel tree"

      - name: Prepare Baseline mwifiex Tree for IW620 Patches
        run: |
          git clone --depth 1 --branch lf-6.18.2_1.0.0 https://github.com/nxp-imx/mwifiex.git /tmp/mwifiex-tree

      - name: Run Sequential Dry-Run Applicator
        run: |
          chmod +x patches/wifi/apply_patches.sh
          ./patches/wifi/apply_patches.sh --dry-run --kernel-dir /tmp/kernel-tree --mwifiex-dir /tmp/mwifiex-tree
