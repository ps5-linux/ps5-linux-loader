name: Verify Wi-Fi Driver Patches

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/wifi/**'
      - '.github/workflows/verify-wifi-patches.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'patches/wifi/**'
      - '.github/workflows/verify-wifi-patches.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Deep Patch Verification, Dual-Kernel Dry-Run & Driver Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Deep Static & Syntax Verification Suite
        run: |
          cd patches/wifi
          python3 verify_patches.py

      - name: Prepare Test Kernel Tree for MT7921 Patches
        run: |
          mkdir -p /tmp/kernel-tree/drivers/net/wireless/mediatek/mt76/mt7921
          mkdir -p /tmp/kernel-tree/arch/x86/configs
          curl -fsSL https://raw.githubusercontent.com/torvalds/linux/7e1392a42ea288d70a266f6553fe06f57f8647ea/drivers/net/wireless/mediatek/mt76/mt7921/init.c -o /tmp/kernel-tree/drivers/net/wireless/mediatek/mt76/mt7921/init.c
          curl -fsSL https://raw.githubusercontent.com/torvalds/linux/7e1392a42ea288d70a266f6553fe06f57f8647ea/drivers/net/wireless/mediatek/mt76/mt7921/pci.c -o /tmp/kernel-tree/drivers/net/wireless/mediatek/mt76/mt7921/pci.c
          curl -fsSL https://raw.githubusercontent.com/ps5-linux/ps5-linux-patches/149608631392c05ebef123f263df6ad7d51c7574/.config -o /tmp/kernel-tree/arch/x86/configs/ps5_defconfig
          git -C /tmp/kernel-tree init
          git -C /tmp/kernel-tree config user.name "CI Validator"
          git -C /tmp/kernel-tree config user.email "ci@ps5-linux.local"
          git -C /tmp/kernel-tree add .
          git -C /tmp/kernel-tree commit -m "Initialize baseline MT7921 kernel tree"

      - name: Prepare Baseline mwifiex Tree for IW620 Patches
        run: |
          git clone --depth 1 --branch lf-6.18.2_1.0.0 https://github.com/nxp-imx/mwifiex.git /tmp/mwifiex-tree

      - name: Run Sequential Dry-Run Applicator (Target Kernel 7)
        run: |
          chmod +x patches/wifi/apply_patches.sh
          ./patches/wifi/apply_patches.sh --dry-run --target-kernel 7 --kernel-dir /tmp/kernel-tree --mwifiex-dir /tmp/mwifiex-tree

      - name: Run Sequential Dry-Run Applicator (Target Kernel 6)
        run: |
          ./patches/wifi/apply_patches.sh --dry-run --target-kernel 6 --kernel-dir /tmp/kernel-tree --mwifiex-dir /tmp/mwifiex-tree

      - name: Build Verification - Compile mwifiex Kernel Modules
        run: |
          git clone --depth 1 --branch lf-6.18.2_1.0.0 https://github.com/nxp-imx/mwifiex.git /tmp/mwifiex-build
          ./patches/wifi/apply_patches.sh --target-kernel 6 --mwifiex-dir /tmp/mwifiex-build
          make -C /tmp/mwifiex-build PWD=/tmp/mwifiex-build KERNELDIR=/lib/modules/$(uname -r)/build ARCH=x86 -j$(nproc)
          test -f /tmp/mwifiex-build/mlan.ko
          test -f /tmp/mwifiex-build/moal.ko
          echo "Empirical Build Verification Succeeded: mlan.ko and moal.ko compiled cleanly!"

      - name: Upload Compiled Driver Module Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps5-wifi-driver-modules
          path: |
            /tmp/mwifiex-build/mlan.ko
            /tmp/mwifiex-build/moal.ko
          retention-days: 14
